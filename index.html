<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sociopay | Society Maintenance Payments and Resident Operations</title>
    <meta
      name="description"
      content="Sociopay helps housing societies manage maintenance billing, resident payments, expenses, receipts, reminders, complaints, and reports from one modern app."

    <meta name="theme-color" content="#1d2340" />

      content="A modern resident and admin app for maintenance collections, Razorpay payments, receipts, reminders, expenses, and reporting."

    <meta property="og:image" content="/app-preview.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div id="root"></div>

    <form name="sociopay-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>

      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>

    <script type="module" src="/src/main.jsx"></script>
